name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # runner 镜像（docker.gitea.com/runner-images:ubuntu-latest）已自带 Node 24 + npm 11；
      # 这里不再用 actions/setup-node —— 实测它会卡在下载 Node 发行包上（14 分钟无进展）。
      - name: 环境信息
        run: node -v && npm -v

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建（静态导出）
        run: npm run build

      - name: 检查构建产物
        run: test -f dist/index.html && echo "dist/index.html 已生成"
